timeout = 10
statusMessage = "navori: managed-block drift"

[[hooks.PostToolUse]]
matcher = "^(Bash|apply_patch|spawn_agent)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "bash \"$(git rev-parse --show-toplevel)/.codex/hooks/routing-watch.sh\""
